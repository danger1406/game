<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Survivor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div class="hud-top">
                <div class="xp-bar-container">
                    <div id="xp-bar-fill"></div>
                    <span id="level-display">LVL 1</span>
                </div>
                <div id="score-display">Score: 0</div>
                <button id="mute-btn" class="icon-btn">🔊</button>
            </div>
            <div class="hud-bottom">
                <div class="health-bar-container">
                    <div id="health-bar-fill"></div>
                    <span id="health-text">100/100</span>
                </div>
                <div class="dash-container">
                    <span class="dash-icon">DASH</span>
                    <div class="dash-bar">
                        <div id="dash-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Level Up Screen -->
        <div id="level-up-screen" class="overlay hidden">
            <h2>LEVEL UP!</h2>
            <div id="upgrade-container">
                <!-- Upgrades will be injected here -->
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
        
        <!-- Start Screen -->
         <div id="start-screen" class="overlay">
            <h1>NEON SURVIVOR</h1>
            <p>WASD to Move. Space to Dash.</p>
            <div class="difficulty-container">
                <button id="btn-easy" class="diff-btn easy">CHILL</button>
                <button id="btn-normal" class="diff-btn normal">NEON</button>
                <button id="btn-hard" class="diff-btn hard">HARDCORE</button>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
